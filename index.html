<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your Rajasthan state exam syllabus progress — RAS Pre 2026, RPSC 2nd Grade Paper I &amp; II Science. Fast, offline-tolerant, built for daily use.">
  <meta name="theme-color" content="#7c6df0">

  <title>Syllabus Tracker — Rajasthan Exams</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">

  <!-- CSS — modular by feature (ARCHITECTURE.md §2) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/study.css">
  <link rel="stylesheet" href="css/progress.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div class="app-container">

    <!-- ═══ Desktop Side Rail ═══ -->
    <nav class="nav-rail desktop-only" id="nav-rail" aria-label="Main navigation">
      <div class="nav-rail__logo">
        <img src="favicon.svg" alt="" width="28" height="28" aria-hidden="true">
        <span class="nav-rail__brand">SyllTrack</span>
      </div>

      <div class="nav-rail__items">
        <button class="nav-item nav-item--active" data-view="home" id="nav-home-desktop" aria-current="page">
          <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-item__label">Home</span>
        </button>
        <button class="nav-item" data-view="study" id="nav-study-desktop">
          <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          <span class="nav-item__label">Study</span>
        </button>
        <button class="nav-item" data-view="progress" id="nav-progress-desktop">
          <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span class="nav-item__label">Progress</span>
        </button>
      </div>

      <div class="nav-rail__footer">
        <!-- Search trigger -->
        <button class="nav-item" id="nav-search-desktop" aria-label="Search (Ctrl+K)">
          <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="nav-item__label">Search</span>
        </button>

        <!-- Theme toggle -->
        <button class="nav-item" id="nav-theme-desktop" aria-label="Toggle theme">
          <svg class="nav-item__icon nav-item__icon--sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="nav-item__icon nav-item__icon--moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <span class="nav-item__label">Theme</span>
        </button>

        <!-- Sync status + auth -->
        <div class="nav-rail__status">
          <span class="sync-indicator" id="sync-indicator-desktop" title="Sync status">
            <span class="sync-dot"></span>
          </span>
          <button class="nav-auth-btn" id="nav-auth-desktop" aria-label="Sign in">
            <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- ═══ Main Content Area ═══ -->
    <main class="main-content" id="main-content">

      <!-- Exam selector bar (visible on all views) -->
      <div class="exam-bar" id="exam-bar">
        <div class="exam-bar__tabs" role="tablist" aria-label="Select exam">
          <!-- Rendered by nav.js -->
        </div>
        <div class="exam-bar__actions">
          <button class="exam-bar__search mobile-only" id="nav-search-mobile" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>

      <!-- View containers — only one visible at a time -->
      <section class="view view--active" id="view-home" role="tabpanel" aria-label="Home">
        <!-- Rendered by home.js (Phase 4) -->
        <div class="view__placeholder">
          <p class="text-secondary">Home view — Phase 4</p>
        </div>
      </section>

      <section class="view" id="view-study" role="tabpanel" aria-label="Study" hidden>
        <!-- Rendered by study.js (Phase 3) -->
        <div class="view__placeholder">
          <p class="text-secondary">Study view — Phase 3</p>
        </div>
      </section>

      <section class="view" id="view-progress" role="tabpanel" aria-label="Progress" hidden>
        <!-- Rendered by progress.js (Phase 5) -->
        <div class="view__placeholder">
          <p class="text-secondary">Progress view — Phase 5</p>
        </div>
      </section>

    </main>

    <!-- ═══ Mobile Bottom Nav ═══ -->
    <nav class="nav-bottom mobile-only" id="nav-bottom" aria-label="Main navigation">
      <button class="nav-bottom__item nav-bottom__item--active" data-view="home" id="nav-home-mobile" aria-current="page">
        <svg class="nav-bottom__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-bottom__label">Home</span>
      </button>
      <button class="nav-bottom__item" data-view="study" id="nav-study-mobile">
        <svg class="nav-bottom__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        <span class="nav-bottom__label">Study</span>
      </button>
      <button class="nav-bottom__item" data-view="progress" id="nav-progress-mobile">
        <svg class="nav-bottom__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="nav-bottom__label">Progress</span>
      </button>
    </nav>

  </div>

  <!-- ═══ Command Palette / Search Overlay (Phase 3) ═══ -->
  <div class="cmd-palette-overlay" id="cmd-palette-overlay" hidden>
    <div class="cmd-palette" id="cmd-palette" role="dialog" aria-label="Search and commands">
      <!-- Built by search.js -->
    </div>
  </div>

  <!-- ═══ Auth Modal ═══ -->
  <div class="modal-overlay" id="auth-modal-overlay" hidden>
    <div class="modal" id="auth-modal" role="dialog" aria-label="Sign in">
      <div class="modal__header">
        <h2 class="title-card">Sign in to sync your progress</h2>
        <button class="modal__close" id="auth-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal__body">
        <p class="text-secondary" style="margin-bottom: var(--sp-4);">
          Sign in with Google to sync your data across devices. Your progress is always saved locally too.
        </p>
        <button class="btn btn--primary btn--google" id="btn-google-signin" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign in with Google
        </button>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="btn-continue-guest" type="button">Continue as guest</button>
      </div>
    </div>
  </div>

  <!-- ═══ Scripts — dependency order (ARCHITECTURE.md §2) ═══ -->
  <!-- Firebase SDK (compat, via CDN — no bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- App scripts — load order matters, no ES modules -->
  <script src="js/firebase-config.js"></script>
  <script src="js/syllabus_data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/search.js"></script>
  <script src="js/export.js"></script>
  <script src="js/home.js"></script>
  <script src="js/study.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/studyhub.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
